services:
  app:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/incidents.db
      - TZ=Asia/Seoul
      # 에이전트 기반(모드 A) — 같은 compose 네트워크의 VictoriaLogs를 직전5분 쿼리
      - VICTORIALOGS_URL=http://victorialogs:9428
    depends_on:
      - victorialogs
    restart: unless-stopped

  # 로그 저장소 — Alloy가 상시 push, 분석앱이 알람 시 직전 5분 쿼리(모드 A).
  # ⚠ 9428은 무인증 — 공인 노출 시 ACG로 소스 IP 제한 필수(에이전트 서버 IP만).
  victorialogs:
    image: victoriametrics/victoria-logs:v1.0.0-victorialogs
    ports:
      - "9428:9428"
    command:
      - "-storageDataPath=/vldata"
      - "-retentionPeriod=7d"
    volumes:
      - ./data/vldata:/vldata
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped
