services:
  app:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/incidents.db
      - TZ=Asia/Seoul
      # 에이전트 기반(모드 A) — 같은 compose 네트워크의 VictoriaLogs를 직전5분 쿼리
      - VICTORIALOGS_URL=http://victorialogs:9428
      - VICTORIAMETRICS_URL=http://victoriametrics:8428
    depends_on:
      - victorialogs
      - victoriametrics
    restart: unless-stopped

  # 로그 저장소 — Alloy가 상시 push, 분석앱이 알람 시 직전 5분 쿼리(모드 A).
  # ⚠ 9428은 무인증 — 공인 노출 시 ACG로 소스 IP 제한 필수(에이전트 서버 IP만).
  victorialogs:
    image: victoriametrics/victoria-logs:v1.0.0-victorialogs
    ports:
      - "9428:9428"
    command:
      - "-storageDataPath=/vldata"
      - "-retentionPeriod=7d"
    volumes:
      - ./data/vldata:/vldata
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

  # 메트릭 저장소 — Alloy가 remote_write로 push, vmalert가 룰 평가.
  # ⚠ 8428은 무인증 — 공인 노출 시 ACG로 에이전트 IP만.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    ports:
      - "8428:8428"
    command:
      - "-storageDataPath=/vmdata"
      - "-retentionPeriod=3"          # 개월. 필요시 조정
    volumes:
      - ./data/vmdata:/vmdata
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

  # 룰 평가 — CPU/메모리/디스크/다운. 발화 시 Alertmanager로.
  vmalert:
    image: victoriametrics/vmalert:v1.106.1
    command:
      - "-datasource.url=http://victoriametrics:8428"
      - "-remoteWrite.url=http://victoriametrics:8428"
      - "-notifier.url=http://alertmanager:9093"
      - "-rule=/etc/vmalert/rules/*.yml"
      - "-evaluationInterval=30s"
    volumes:
      - ./monitoring/vmalert/rules:/etc/vmalert/rules:ro
    depends_on:
      - victoriametrics
      - alertmanager
    restart: unless-stopped

  # 알람 라우팅 — dedup/그룹핑 후 분석앱 webhook(/webhook/alert)으로.
  # (이메일은 분석앱이 AI 분석 후 직접 발송 → Alertmanager는 webhook만)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ingest.htpasswd:/etc/nginx/ingest.htpasswd:ro   # 에이전트 인제스트 basic-auth (배포 전 생성)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
      - victoriametrics
      - victorialogs
    restart: unless-stopped
