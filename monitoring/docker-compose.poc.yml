# 에이전트 기반 PoC — 로컬 VictoriaLogs (모드 A)
#
# 이 레포(분석서버)는 알람 시 VictoriaLogs를 직전 5분 쿼리한다.
# 메트릭/알람 스택(VictoriaMetrics · vmalert · Alertmanager)은 monitoring_msp 담당 → 여기서 안 띄운다.
# 로컬 검증: VictoriaLogs만 띄우고 Alloy로 로그 push → /webhook/alert 에 합성 Alertmanager 알람을 쏴 e2e.
#
# 실행:  docker compose -f monitoring/docker-compose.poc.yml up -d
# 중지:  docker compose -f monitoring/docker-compose.poc.yml down
#
# ⚠ 이미지 태그는 작성 시점 기준 — up 전에 유효 태그인지 확인하고 필요 시 조정.
name: air-poc

services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.0.0-victorialogs
    ports:
      - "9428:9428"
    command:
      - "-storageDataPath=/vldata"
      - "-retentionPeriod=7d"
    volumes:
      - vldata:/vldata
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

volumes:
  vldata:
