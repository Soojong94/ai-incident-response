# 에이전트 기반 PoC — 로컬 관측 스택
# VictoriaMetrics(메트릭) + VictoriaLogs(로그) + vmalert(룰) + 브리지(알람→OBS 업로드)
#
# 기존 ../docker-compose.yml(라이브 app/nginx)과 분리한 로컬 검증용 compose.
# 서버(tbit-air-pub) 배포 시 이 4개 서비스를 메인 compose로 병합한다(결정 #1).
#
# 실행:  docker compose -f monitoring/docker-compose.poc.yml --env-file .env up -d
# 중지:  docker compose -f monitoring/docker-compose.poc.yml down
#
# ⚠ 이미지 태그는 작성 시점 기준. up 전에 최신/유효 태그인지 확인하고 필요 시 조정.
name: air-poc

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.111.0
    ports:
      - "8428:8428"
    command:
      - "-retentionPeriod=7d"
      - "-storageDataPath=/vmdata"
    volumes:
      - vmdata:/vmdata
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.0.0-victorialogs
    ports:
      - "9428:9428"
    command:
      - "-storageDataPath=/vldata"
      - "-retentionPeriod=7d"
    volumes:
      - vldata:/vldata
    environment:
      - TZ=Asia/Seoul
    restart: unless-stopped

  vmalert:
    image: victoriametrics/vmalert:v1.111.0
    ports:
      - "8880:8880"
    command:
      - "-datasource.url=http://victoriametrics:8428"
      - "-remoteWrite.url=http://victoriametrics:8428"   # ALERTS 상태 저장(선택)
      - "-notifier.url=http://bridge:8080"               # 결정 #3: Alertmanager 없이 브리지로 직접
      - "-rule=/etc/vmalert/alerts.yml"
      - "-evaluationInterval=30s"
      - "-httpListenAddr=:8880"
    volumes:
      - ./vmalert/alerts.yml:/etc/vmalert/alerts.yml:ro
    depends_on:
      - victoriametrics
      - bridge
    restart: unless-stopped

  bridge:
    build: ./bridge
    ports:
      - "8080:8080"
    env_file:
      - ../.env                       # NCP_ACCESS_KEY / NCP_SECRET_KEY (중앙 루트 키) 재사용
    environment:
      - VICTORIALOGS_URL=http://victorialogs:9428
      - OBS_ENDPOINT=https://kr.object.ncloudstorage.com
      - OBS_BUCKET=tbit-air           # 중앙 버킷(같은 계정 업로드 → grant 불필요)
      - LOG_WINDOW_SECONDS=300        # 알람 직전 5분
      - TZ=Asia/Seoul
    depends_on:
      - victorialogs
    restart: unless-stopped

volumes:
  vmdata:
  vldata:
