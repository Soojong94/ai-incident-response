# 폐쇄망 검증 — closed(폐쇄망 에이전트)는 internal(인터넷X) 네트워크, gateway만 egress 보유.
# closed가 중앙에 직접 못 가고 gateway 경유로만 도달함을 입증.
#   docker compose -f monitoring/relay-test/docker-compose.yml up -d
name: air-relay-test

networks:
  closed-net:
    internal: true     # 인터넷 차단 (폐쇄망 시뮬)
  egress: {}           # 인터넷 가능

services:
  gateway:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ../alloy/gateway.alloy:/etc/alloy/config.alloy:ro
    environment:
      - RESOURCE_NAME=gateway-test
      - CENTRAL_VM_URL=http://101.79.23.149:8428/api/v1/write
      - CENTRAL_VL_URL=http://101.79.23.149:9428/insert/loki/api/v1/push
    networks: [closed-net, egress]
    restart: unless-stopped

  closed:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/tmp/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ../alloy/closed.alloy:/etc/alloy/config.alloy:ro
    environment:
      - RESOURCE_NAME=closed-test
      - GATEWAY_VM_URL=http://gateway:9999/api/v1/metrics/write
      - GATEWAY_VL_URL=http://gateway:9998/loki/api/v1/push
      - LOG_PATH=/tmp/none.log
    networks: [closed-net]      # 인터넷 없음 — gateway로만 도달 가능
    depends_on: [gateway]
    restart: unless-stopped
