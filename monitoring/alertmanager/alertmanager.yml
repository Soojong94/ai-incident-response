# Alertmanager — dedup/그룹핑 후 분석앱 webhook으로만 전달.
# 이메일은 분석앱이 AI 분석 후 직접 발송하므로 여기선 webhook만(이중 메일 방지).
route:
  group_by: ['host', 'alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'ai-analysis'

receivers:
  - name: 'ai-analysis'
    webhook_configs:
      - url: 'http://app:8000/webhook/alert'   # 같은 compose 네트워크(localhost)
        send_resolved: true                    # 해제 통지 → 앱이 해당 incident를 resolved 처리
