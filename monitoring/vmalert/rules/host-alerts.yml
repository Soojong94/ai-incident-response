# 정적 룰. CPU/메모리/디스크 임계값은 사이트별 generated.yml(대시보드에서 설정)로 이전됨.
# 여기엔 전역 안전망만 둔다. (서버 무응답 per-host 감지는 Phase 3에서 앱/생성룰로 정교화)
groups:
  - name: host.rules
    interval: 60s
    rules:
      # 전체 수신 중단(중앙 관측 경로 이상) 감지 — 모든 host 메트릭이 5분간 끊기면 발화
      - alert: AllHostsSilent
        expr: absent_over_time(node_uname_info[5m]) == 1
        for: 0m
        labels:
          alarm: silent
        annotations:
          summary: "관측 수신 중단 — 5분간 어떤 서버의 메트릭도 들어오지 않음"
