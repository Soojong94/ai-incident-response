<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI 장애 대응</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <style>
    :root, [data-theme="dark"] {
      --bg: #0f1117; --card-bg: #1a1d2e; --border: #2d3748;
      --text: #e2e8f0; --text-muted: #a0aec0; --text-subtle: #718096;
      --input-bg: #0f1117; --primary: #2b6cb0; --danger: #e53e3e;
    }
    [data-theme="light"] {
      --bg: #e2e5ea; --card-bg: #eaecf0; --border: #c4cad3;
      --text: #2d3748; --text-muted: #4a5568; --text-subtle: #6b7280;
      --input-bg: #f5f7fa; --primary: #2b6cb0; --danger: #c53030;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 380px; max-width: 92vw; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.4); }
    h1 { font-size: 18px; margin-bottom: 12px; }
    p { color: var(--text-subtle); font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
    label { display: block; margin-bottom: 14px; }
    label .lbl { font-size: 12px; color: var(--text-subtle); display: block; margin-bottom: 4px; }
    input[type=password] { width: 100%; padding: 10px 12px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: var(--primary); }
    button { width: 100%; padding: 10px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #2c5282; }
    .error { background: rgba(229, 62, 62, 0.15); border: 1px solid var(--danger); color: var(--danger); padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>새 비밀번호 설정</h1>
    {% if not valid %}
      <div class="error">
        이 링크는 유효하지 않거나 만료되었습니다. <br>
        <a href="/forgot-password" style="color: var(--primary);">다시 요청하기</a>
      </div>
    {% else %}
      {% if request.query_params.get('error') == 'too_short' %}
        <div class="error">비밀번호는 최소 8자 이상이어야 합니다.</div>
      {% endif %}
      <p>새 비밀번호를 입력하세요. (최소 8자)</p>
      <form method="POST" action="/reset/{{ token }}">
        <label>
          <span class="lbl">새 비밀번호</span>
          <input type="password" name="new_password" required autofocus minlength="8">
        </label>
        <button type="submit">비밀번호 변경</button>
      </form>
    {% endif %}
  </div>
</body>
</html>
