<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 찾기 — AI 장애 대응</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <style>
    :root, [data-theme="dark"] {
      --bg: #0f1117; --card-bg: #1a1d2e; --border: #2d3748;
      --text: #e2e8f0; --text-muted: #a0aec0; --text-subtle: #718096;
      --input-bg: #0f1117; --primary: #2b6cb0;
    }
    [data-theme="light"] {
      --bg: #e2e5ea; --card-bg: #eaecf0; --border: #c4cad3;
      --text: #2d3748; --text-muted: #4a5568; --text-subtle: #6b7280;
      --input-bg: #f5f7fa; --primary: #2b6cb0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 380px; max-width: 92vw; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.4); }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p { color: var(--text-subtle); font-size: 13px; line-height: 1.5; margin-bottom: 18px; }
    label { display: block; margin-bottom: 14px; }
    label .lbl { font-size: 12px; color: var(--text-subtle); display: block; margin-bottom: 4px; }
    input[type=email] { width: 100%; padding: 10px 12px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: var(--primary); }
    button { width: 100%; padding: 10px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #2c5282; }
    .ok { background: rgba(72, 187, 120, 0.15); border: 1px solid #38a169; color: #38a169; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    .links { margin-top: 18px; text-align: center; font-size: 12px; }
    .links a { color: var(--text-subtle); text-decoration: none; }
    .links a:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="card">
    <h1>비밀번호 찾기</h1>
    <p>가입한 이메일 주소를 입력하시면 재설정 링크를 보내드립니다.</p>

    {% if sent %}
    <div class="ok">
      ✓ 입력한 이메일이 등록되어 있다면 1~2분 안에 재설정 링크가 도착합니다. 받은편지함을 확인하세요.
    </div>
    {% endif %}

    <form method="POST" action="/forgot-password">
      <label>
        <span class="lbl">이메일</span>
        <input type="email" name="email" required autofocus placeholder="you@example.com">
      </label>
      <button type="submit">재설정 링크 보내기</button>
    </form>

    <div class="links">
      <a href="/login">← 로그인으로</a>
    </div>
  </div>
</body>
</html>
