<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 장애 대응</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta name="theme-color" content="#c0564b">
  <script>
    // 페이지 깜빡임 방지 — body 렌더 전에 테마 적용
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <style>
    /* ── Theme variables ────────────────────────────────────────────── */
    /* 따뜻한 오프화이트 + 붉은(벽돌/코랄) 계열. 기본(:root) = 밝은 테마 */
    :root, [data-theme="light"] {
      --bg:           #faf6f3;
      --nav-bg:       #f3eae5;
      --card-bg:      #ffffff;
      --card-bg-alt:  #f7efea;
      --border:       #ddcdc6;
      --border-soft:  #ece1db;
      --text:         #2b211d;
      --text-muted:   #6b5950;
      --text-subtle:  #8a766c;
      --text-faint:   #b6a69c;
      --link:         #b04a3f;
      --input-bg:     #ffffff;
      --code-bg:      #f3eae5;
      --row-hover:    #f7efea;
      --primary:      #c0564b;
      --primary-hover:#a64539;
      --danger:       #b03a2e;
      --accent:       #c0564b;
    }
    [data-theme="dark"] {
      --bg:           #1c1715;
      --nav-bg:       #241d1a;
      --card-bg:      #241d1a;
      --card-bg-alt:  #1c1715;
      --border:       #4a3d38;
      --border-soft:  #2e2521;
      --text:         #f0e6e1;
      --text-muted:   #c0aaa0;
      --text-subtle:  #9a857b;
      --text-faint:   #6b5950;
      --link:         #e2897d;
      --input-bg:     #1c1715;
      --code-bg:      #2e2521;
      --row-hover:    #2e2521;
      --primary:      #c0564b;
      --primary-hover:#a64539;
      --danger:       #e2897d;
      --accent:       #e2897d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .navbar {
      background: var(--nav-bg); border-bottom: 2px solid var(--border); padding: 12px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .navbar h1 { font-size: 18px; font-weight: 700; color: var(--text); }
    .navbar span { font-size: 12px; color: var(--text-subtle); }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 12px; font-weight: 600;
    }
    .badge-processing  { background: #f6e1dc; color: #8f3a30; }
    .badge-analyzed    { background: #c0564b; color: #ffffff; }
    .badge-ai_failed   { background: #475569; color: #ffffff; }
    .badge-suppressed  { background: #e2e8f0; color: #475569; }
    .badge-resolved    { background: #d3f9d8; color: #2b8a3e; }

    .sev-Critical { color: #7e3329; font-weight: 800; }
    .sev-High     { color: #a64539; font-weight: 700; }
    .sev-Medium   { color: #d07a6e; font-weight: 600; }
    .sev-Low      { color: #64748b; }
    [data-theme="dark"] .sev-Critical { color: #f0b3a9; font-weight: 800; }
    [data-theme="dark"] .sev-High     { color: #e2897d; }
    [data-theme="dark"] .sev-Medium   { color: #d07a6e; }
    [data-theme="dark"] .sev-Low      { color: #94a3b8; }

    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th { background: var(--card-bg); color: var(--text-muted); font-size: 12px; text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
    tr:hover td { background: var(--row-hover); }

    .card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 16px; color: var(--text-muted); margin-bottom: 12px; }
    .card h3 { font-size: 14px; color: var(--text-subtle); margin-bottom: 8px; }

    pre { background: var(--card-bg-alt); border: 1px solid var(--border); border-radius: 4px; padding: 12px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; color: var(--text-muted); }

    .actions-list { list-style: none; }
    .actions-list li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .actions-list li:before { content: "▸ "; color: var(--link); }

    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .meta-item label { font-size: 11px; color: var(--text-subtle); display: block; margin-bottom: 2px; }
    .meta-item span  { font-size: 14px; }

    input[type=text], input[type=email], input[type=url], input[type=search], input[type=number], input[type=password], select, textarea {
      background: var(--input-bg); color: var(--text); border: 2px solid var(--border);
      border-radius: 6px; padding: 7px 11px; font-size: 14px; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(192,86,75,.12); }

    /* ? 호버 툴팁 */
    .qmark { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%;
      border:1.5px solid var(--text-subtle); color:var(--text-subtle); font-size:10px; font-weight:800; cursor:help;
      margin-left:6px; position:relative; vertical-align:middle; }
    .qmark:hover { border-color:var(--primary); color:var(--primary); }
    .qmark:hover::after { content: attr(data-tip); position:absolute; bottom:140%; left:50%; transform:translateX(-50%);
      background:#2b211d; color:#fff; padding:8px 11px; border-radius:7px; font-size:12px; font-weight:400; line-height:1.55;
      width:max-content; max-width:270px; white-space:normal; text-align:left; z-index:1000; box-shadow:0 6px 18px rgba(0,0,0,.28); }
    .qmark:hover::before { content:""; position:absolute; bottom:140%; left:50%; transform:translate(-50%,80%);
      border:5px solid transparent; border-top-color:#2b211d; z-index:1000; }

    .refresh-btn {
      background: var(--primary); color: white; border: none; padding: 8px 16px;
      border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: auto;
    }
    .refresh-btn:hover { background: var(--primary-hover); }

    .nav-btn {
      padding: 6px 14px; border-radius: 5px; font-size: 13px;
      text-decoration: none; border: 2px solid transparent; transition: all 0.15s;
      cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-btn-primary  { background: var(--primary); color: white; border-color: var(--primary); }
    .nav-btn-primary:hover  { background: var(--primary-hover); border-color: var(--primary-hover); text-decoration: none; }
    .nav-btn-accent   { background: #c0564b; color: #ffffff; border-color: #c0564b; font-weight: 600; }
    .nav-btn-accent:hover { background: #a64539; border-color: #a64539; text-decoration: none; color: #fff; }
    .nav-btn-outline  { background: transparent; color: var(--text); border-color: var(--border); }
    .nav-btn-outline:hover { background: var(--row-hover); border-color: var(--primary); text-decoration: none; }
    .nav-btn-danger   { background: #a64539; color: white; border-color: #a64539; font-weight: 600; }
    .nav-btn-danger:hover { background: #8f3a30; border-color: #8f3a30; color: white; text-decoration: none; }

    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--text); text-decoration: none;
    }
    .brand:hover { text-decoration: none; }
    .brand .logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #c0564b 0%, #a64539 100%);
      color: #1a202c;
    }
    [data-theme="dark"] .brand .logo { color: #1a1d2e; }
    .brand .title {
      font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
      background: linear-gradient(135deg, #c0564b 0%, #a64539 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .icon-btn {
      background: transparent; border: 2px solid var(--border); color: var(--text-muted);
      padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-family: inherit;
    }
    .icon-btn:hover { background: var(--row-hover); color: var(--text); }
    .icon-btn.danger:hover { background: #c0564b; color: #ffffff; border-color: #c0564b; }

    .empty { text-align: center; padding: 60px; color: var(--text-faint); }

    /* Markdown rendered content */
    .md-render p  { margin: 4px 0 8px; }
    .md-render ul, .md-render ol { padding-left: 20px; margin: 6px 0; }
    .md-render li { margin: 3px 0; line-height: 1.6; }
    .md-render pre { margin: 8px 0; }
    .md-render code { background: var(--code-bg); border-radius: 3px; padding: 1px 5px; font-size: 12px; color: var(--text); }
    .md-render pre code { padding: 0; background: none; }
    .md-render h1, .md-render h2, .md-render h3 { color: var(--text-muted); margin: 10px 0 4px; }

    .action-item {
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 14px; margin-bottom: 8px;
      font-size: 13px; line-height: 1.55; color: var(--text);
    }
    .action-item:before { content: none; }
    /* action-item 안 마크다운 — 일반 텍스트 톤으로 축소 */
    .action-item.md-render h1,
    .action-item.md-render h2,
    .action-item.md-render h3,
    .action-item.md-render h4 {
      font-size: 13px; font-weight: 600; margin: 2px 0;
      color: var(--text); display: inline;
    }
    .action-item.md-render p { margin: 2px 0; }
    .action-item.md-render ul, .action-item.md-render ol { padding-left: 18px; margin: 4px 0; }
    .action-item.md-render li { margin: 2px 0; line-height: 1.5; }
    .action-item.md-render pre { font-size: 11px; padding: 6px 8px; margin: 4px 0; }
    .action-item.md-render code { font-size: 11px; padding: 1px 4px; }
    .action-item.md-render pre code { font-size: 11px; }

    .theme-toggle {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      width: 32px; height: 32px; border-radius: 4px; cursor: pointer; font-size: 14px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .theme-toggle:hover { background: var(--row-hover); color: var(--text); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">
      <span class="logo">
        <svg width="22" height="22" viewBox="0 0 32 32">
          <path d="M16 4.2 L6.5 7.2 v8.3 c0 5.5 3.6 9.2 9.5 11.3 c5.9-2.1 9.5-5.8 9.5-11.3 V7.2 z" fill="currentColor"/>
          <text x="16" y="20.3" font-family="Arial Black, system-ui, sans-serif" font-size="10.5" font-weight="900" fill="#c0564b" text-anchor="middle" letter-spacing="-0.5">AI</text>
        </svg>
      </span>
      <span class="title">AI 장애 대응</span>
    </a>
    <span style="font-size:12px; color:var(--text-subtle);">Grafana Alloy · AI 분석</span>

    <a href="/" class="nav-btn nav-btn-danger" style="margin-left:auto;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      장애 목록
    </a>
    <a href="/sites" class="nav-btn nav-btn-accent">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      사이트 관리
    </a>
    {% if current_user and current_user.role == 'admin' %}
    <a href="/stats" class="nav-btn nav-btn-outline" title="운영 통계 (admin)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6"  y1="20" x2="6"  y2="14"/>
      </svg>
      통계
    </a>
    <a href="/notifications" class="nav-btn nav-btn-outline" title="알림 발송 로그 (admin)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      알림 로그
    </a>
    <a href="/admin/users" class="nav-btn nav-btn-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      계정 관리
    </a>
    {% endif %}
    <button class="theme-toggle" onclick="toggleTheme()" title="테마 전환" id="theme-toggle-btn"></button>

    {% if current_user %}
    <div style="position:relative;">
      <button class="nav-btn nav-btn-outline" onclick="toggleUserMenu()" id="user-menu-btn" style="gap:8px;">
        <span style="display:inline-flex; width:22px; height:22px; border-radius:50%; background:var(--primary); color:#fff; align-items:center; justify-content:center; font-size:11px; font-weight:700;">{{ (current_user.name or current_user.email)[0] | upper }}</span>
        <span>{{ current_user.name or current_user.email }}</span>
        {% if current_user.role == 'admin' %}<span style="font-size:10px; padding:1px 5px; background:#475569; color:#ffffff; border-radius:2px;">admin</span>{% endif %}
      </button>
      <div id="user-menu" style="display:none; position:absolute; right:0; top:100%; margin-top:6px; background:var(--card-bg); border:1px solid var(--border); border-radius:6px; min-width:200px; box-shadow:0 6px 20px -8px rgba(0,0,0,0.4); z-index:50;">
        <div style="padding:10px 14px; border-bottom:1px solid var(--border-soft); font-size:12px; color:var(--text-subtle);">
          {{ current_user.email }}
        </div>
        <a href="/me/password" style="display:block; padding:8px 14px; font-size:13px; color:var(--text); text-decoration:none;" onmouseover="this.style.background='var(--row-hover)'" onmouseout="this.style.background=''">비밀번호 변경</a>
        <a href="/logout" style="display:block; padding:8px 14px; font-size:13px; color:var(--danger); text-decoration:none; border-top:1px solid var(--border-soft);" onmouseover="this.style.background='var(--row-hover)'" onmouseout="this.style.background=''">로그아웃</a>
      </div>
    </div>
    {% endif %}
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>

  {% if current_user %}
  <style>
    .help-fab { position: fixed; right: 22px; bottom: 22px; z-index: 900; display: flex; align-items: center; gap: 8px;
      padding: 12px 18px; border-radius: 999px; background: #c0564b; color: #ffffff; font-weight: 800; font-size: 14px;
      box-shadow: 0 4px 16px rgba(192,86,75,.32); text-decoration: none; transition: filter .12s, transform .12s; }
    .help-fab:hover { filter: brightness(1.08); transform: translateY(-1px); text-decoration: none; color: #ffffff; }
  </style>
  <a href="/guide" class="help-fab" title="에이전트 설치 & 사이트 사용 가이드">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    가이드
  </a>
  {% endif %}
<script>
  // 테마 토글 ─────────────────────────────────────────────────────────
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') || 'light';
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    var btn = document.getElementById('theme-toggle-btn');
    if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
  }
  function toggleTheme() {
    applyTheme(currentTheme() === 'light' ? 'dark' : 'light');
  }
  applyTheme(currentTheme());

  // 사용자 메뉴 드롭다운
  function toggleUserMenu() {
    var m = document.getElementById('user-menu');
    if (m) m.style.display = (m.style.display === 'block') ? 'none' : 'block';
  }
  document.addEventListener('click', function(e) {
    var btn = document.getElementById('user-menu-btn');
    var menu = document.getElementById('user-menu');
    if (!menu || !btn) return;
    if (!btn.contains(e.target) && !menu.contains(e.target)) menu.style.display = 'none';
  });

  if (typeof marked !== 'undefined') {
    marked.setOptions({ breaks: true, gfm: true });
    document.querySelectorAll('.md-render').forEach(el => {
      el.innerHTML = marked.parse(el.dataset.md || '');
    });
  }
</script>
</body>
</html>
