<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>KT Cloud D-platform — Open API 전체</title>
  <style>
    body { margin: 0; font-family: -apple-system, sans-serif; }
    [class*="references-app-bar"],
    [class*="scalar-app-bar"],
    [class*="developer-tools"],
    [class*="deploy-button"],
    [class*="share-button"],
    [class*="configure-button"],
    [class*="theme-switcher"],
    [class*="dark-mode-toggle"],
    [class*="darklight"],
    [class*="generate-mcp"],
    [class*="mcp-button"],
    [class*="mcp-server"],
    [aria-label*="MCP" i],
    [title*="MCP" i],
    [aria-label*="theme" i],
    [aria-label*="dark mode" i],
    button[class*="mcp"],
    .scalar-app-bar, .scalar-toolbar { display: none !important; }
  </style>
</head>
<body>
  <script
    id="api-reference"
    data-url="./specs/kt-d-platform.yaml"
    data-configuration='{ "hideTestRequestButton": false, "hideClientButton": false, "showSidebar": true, "proxyUrl": "http://localhost:8090", "darkMode": false, "forceDarkModeState": "light", "hideDarkModeToggle": true, "theme": "kepler" }'
  ></script>
  <script src="./vendor/scalar-standalone.js"></script>
</body>
</html>
