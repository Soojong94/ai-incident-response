components:
  parameters:
    Zone:
      name: zone
      in: path
      required: true
      schema: { type: string, enum: [d1, d2, gd1, gd4] }
      description: D-platform zone
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string }
      description: Keystone project ID
    CdnCommon:
      name: apiKey
      in: query
      required: true
      schema: { type: string }
      description: |
        CDN/AutoScaling/Messaging 공통 인증 파라미터.
        실제 호출 시 추가로 `response=json`, `signature=<HMAC-SHA1>` 도 query 에 포함되어야 함.
    AsgCommon:
      name: apiKey
      in: query
      required: true
      schema: { type: string }
      description: AutoScaling 인증. 추가로 response, signature 필요.
    MsgCommon:
      name: apiKey
      in: query
      required: true
      schema: { type: string }
      description: Messaging 인증. 추가로 response, signature 필요.
  securitySchemes:
    KeystoneToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: /identity/auth/tokens 응답 헤더의 X-Subject-Token
