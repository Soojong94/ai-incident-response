  # ============================================================
  # Storage - ObjectStorage 3.0 (host: ss1.cloud.kt.com:1000)
  # 인증은 KT 자체 signature (Date + Authorization 헤더)
  # ============================================================
  /v1/{tenant_id}:
    get:
      tags: [Storage - ObjectStorage 3.0]
      summary: 파일박스(컨테이너) 목록 — 실제 host=ss1.cloud.kt.com:1000
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string } }
        - { name: Date, in: header, required: true, schema: { type: string } }
        - { name: Authorization, in: header, required: true, schema: { type: string } }
      responses: { "200": { description: 파일박스 목록 } }

  /v1/{tenant_id}/{filebox_name}:
    parameters:
      - { name: tenant_id, in: path, required: true, schema: { type: string } }
      - { name: filebox_name, in: path, required: true, schema: { type: string } }
      - { name: Date, in: header, required: true, schema: { type: string } }
      - { name: Authorization, in: header, required: true, schema: { type: string } }
    put:
      tags: [Storage - ObjectStorage 3.0]
      summary: 파일박스 생성
      responses: { "201": { description: 생성됨 } }
    get:
      tags: [Storage - ObjectStorage 3.0]
      summary: 파일박스 내 파일 목록
      responses: { "200": { description: 파일 목록 } }
    delete:
      tags: [Storage - ObjectStorage 3.0]
      summary: 파일박스 삭제
      responses: { "204": { description: 삭제됨 } }

  /v1/{tenant_id}/{filebox_name}/{file}:
    parameters:
      - { name: tenant_id, in: path, required: true, schema: { type: string } }
      - { name: filebox_name, in: path, required: true, schema: { type: string } }
      - { name: file, in: path, required: true, schema: { type: string } }
      - { name: Date, in: header, required: true, schema: { type: string } }
      - { name: Authorization, in: header, required: true, schema: { type: string } }
    put:
      tags: [Storage - ObjectStorage 3.0]
      summary: 파일 업로드 (또는 멀티파트 파트 업로드)
      parameters:
        - { name: partNumber, in: query, schema: { type: string }, description: 멀티파트 시 파트 번호 }
        - { name: uploadId, in: query, schema: { type: string }, description: 멀티파트 업로드 세션 ID }
        - { name: Content-Type, in: header, schema: { type: string } }
      responses: { "201": { description: 업로드됨 } }
    get:
      tags: [Storage - ObjectStorage 3.0]
      summary: 파일 다운로드
      responses: { "200": { description: 다운로드 } }
    delete:
      tags: [Storage - ObjectStorage 3.0]
      summary: 파일 삭제
      responses: { "204": { description: 삭제됨 } }
    post:
      tags: [Storage - ObjectStorage 3.0]
