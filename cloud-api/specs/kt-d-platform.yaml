openapi: 3.0.3
info:
  title: KT Cloud D-platform — Open API 전체
  version: "1.0"
  description: |
    KT Cloud D-platform Open API 전체.
    출처: https://cloud.kt.com/docs/open-api-guide/d/guide/how-to-use

    Zone abbreviations:
      - d1  (DX-M1)
      - d2  (DX-Central)
      - gd1 (DX-G)
      - gd4 (DX-G-YS)

    기본 인증: Keystone v3 토큰 (X-Subject-Token → 후속 호출의 X-Auth-Token)

    CDN/WAF/AutoScaling/Messaging 은 단일 endpoint + command 쿼리 파라미터 방식이라
    OpenAPI 의 path 1개로 표현이 불가능 → 각 command 별 synthetic path 로 분리 표기하였음.
    실제 호출 시에는 각 operation 의 description 에 명시된 base URL 에 ?command=... 형태로 호출.

servers:
  - url: https://api.ucloudbiz.olleh.com
    description: D-platform 공용 base (Compute / Network / Storage 일부 / CDN / WAF / AutoScaling / Messaging / Watch)
  - url: https://ss1.cloud.kt.com:1000
    description: Object Storage 3.0 전용 host

x-tagGroups:
  - name: 공통
    tags:
      - 인증
  - name: Computing
    tags:
      - Compute - Virtual Machine
      - Compute - Networking
      - Compute - Tier
      - Compute - Volume
      - Compute - Image
      - Compute - Snapshot
      - Compute - SSH Keypair
      - Compute - Resource Log
  - name: Network
    tags:
      - Network - LoadBalancer
      - Network - GSLB
  - name: Storage
    tags:
      - Storage - NAS
      - Storage - ObjectStorage 3.0
      - Storage - ObjectStorage 2.0
      - Storage - ObjectStorage 1.0
  - name: CDN
    tags:
      - CDN
  - name: Security
    tags:
      - Security - WAF
  - name: Management
    tags:
      - Management - AutoScaling
      - Management - Watch
      - Management - Messaging

tags:
  - { name: 인증 }
  - { name: Compute - Virtual Machine }
  - { name: Compute - Networking }
  - { name: Compute - Tier }
  - { name: Compute - Volume }
  - { name: Compute - Image }
  - { name: Compute - Snapshot }
  - { name: Compute - SSH Keypair }
  - { name: Compute - Resource Log }
  - { name: Network - LoadBalancer }
  - { name: Network - GSLB }
  - { name: Storage - NAS }
  - { name: Storage - ObjectStorage 3.0 }
  - { name: Storage - ObjectStorage 2.0 }
  - { name: Storage - ObjectStorage 1.0 }
  - { name: CDN }
  - { name: Security - WAF }
  - { name: Management - AutoScaling }
  - { name: Management - Watch }
  - { name: Management - Messaging }

paths:
  # ============================================================
  # 인증 (Keystone v3) — 모든 Compute / Storage / Watch 등 D-platform API 의 사전 단계
  # ============================================================
  /{zone}/identity/auth/tokens:
    post:
      tags: [인증]
      summary: Keystone v3 토큰 발급
      description: |
        응답 header `X-Subject-Token` = bearer 토큰.
        응답 body.token.project.id = project_id (cinder/manila URL 에 필요).
      parameters:
        - { name: zone, in: path, required: true, schema: { type: string, enum: [d1, d2, gd1, gd4] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth]
              properties:
                auth:
                  type: object
                  properties:
                    identity:
                      type: object
                      properties:
                        methods: { type: array, items: { type: string, enum: [password] } }
                        password:
                          type: object
                          properties:
                            user:
                              type: object
                              required: [name, password]
                              properties:
                                domain: { type: object, properties: { id: { type: string, default: default } } }
                                name: { type: string, example: user@example.com }
                                password: { type: string, format: password }
                    scope:
                      type: object
                      properties:
                        project:
                          type: object
                          properties:
                            domain: { type: object, properties: { id: { type: string, default: default } } }
                            name: { type: string, example: user@example.com }
      responses: { "201": { description: 토큰 발급 (X-Subject-Token 헤더) } }

  # ============================================================
  # Compute - Virtual Machine
  # ============================================================
  /{zone}/server/servers:
    post:
      tags: [Compute - Virtual Machine]
      summary: VM 생성 (async)
      parameters: [{ $ref: "#/components/parameters/Zone" }]
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server]
              properties:
                server:
                  type: object
                  required: [name, key_name, flavorRef, networks, block_device_mapping_v2]
                  properties:
                    name: { type: string }
                    key_name: { type: string, description: SSH keypair 이름 }
                    flavorRef: { type: string }
                    availability_zone: { type: string, default: DX-M1 }
                    networks: { type: array, items: { type: object } }
                    block_device_mapping_v2: { type: array, items: { type: object } }
                    user_data: { type: string, description: base64 startup script }
      responses: { "202": { description: 생성 요청 수락 } }

  /{zone}/server/servers/detail:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM detail 목록
      parameters: [{ $ref: "#/components/parameters/Zone" }]
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: VM detail 목록 } }

  /{zone}/server/servers/{server_id}:
    parameters:
      - $ref: "#/components/parameters/Zone"
      - { name: server_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 상세 조회
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: VM 상세 } }
    delete:
      tags: [Compute - Virtual Machine]
      summary: VM 삭제
      security: [{ KeystoneToken: [] }]
      responses: { "204": { description: 삭제됨 } }

  /{zone}/server/servers/{server_id}/os-interface:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 네트워크 인터페이스 조회
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: server_id, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: interface 목록 } }

  /{zone}/server/servers/{server_id}/action:
    post:
      tags: [Compute - Virtual Machine]
      summary: VM 액션 (forceDelete / shelve / unshelve / resize)
      description: |
        body 의 키로 액션 구분:
          - `forceDelete`  : 강제 삭제
          - `shelve`       : 정지 (async)
          - `unshelve`     : 시작 (async)
          - `resize`       : flavor 변경 — `resize.flavorRef`
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: server_id, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forceDelete: { type: string, nullable: true }
                shelve: { type: string, nullable: true }
                unshelve: { type: string, nullable: true }
                resize:
                  type: object
                  properties: { flavorRef: { type: string } }
      responses: { "202": { description: 요청 수락 } }

  /{zone}/server/flavors/detail:
    get:
      tags: [Compute - Virtual Machine]
      summary: flavor 목록 (CPU/Memory 사양)
      parameters: [{ $ref: "#/components/parameters/Zone" }]
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: flavor 목록 } }

  /{zone}/server/networks/traffics:
    get:
      tags: [Compute - Virtual Machine]
      summary: 네트워크 사용량 조회
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: yearMonth, in: query, required: true, schema: { type: string, example: "2026-05" } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 트래픽 사용량 } }

  /{zone}/server/networks/alarms/history:
    get:
      tags: [Compute - Virtual Machine]
      summary: 네트워크 사용량 알람 이력
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: yearMonth, in: query, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 알람 이력 } }

  # ============================================================
  # Compute - Networking (NSM)
  # ============================================================
  /{zone}/nsm/v1/publicIp:
    get:
      tags: [Compute - Networking]
      summary: Public IP 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: page, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string } }
        - { name: cidr, in: query, schema: { type: string } }
        - { name: publicIpId, in: query, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: "{ data: [...] }" } }
    post:
      tags: [Compute - Networking]
      summary: Public IP 생성
      parameters: [{ $ref: "#/components/parameters/Zone" }]
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 생성됨 } }

  /{zone}/nsm/v1/publicIp/{publicIpId}:
    delete:
      tags: [Compute - Networking]
      summary: Public IP 삭제
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: publicIpId, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 삭제됨 } }

  /{zone}/nsm/v1/portforwarding:
    get:
      tags: [Compute - Networking]
      summary: 포트포워딩 규칙 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: page, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string } }
        - { name: mappedIp, in: query, schema: { type: string } }
        - { name: protocol, in: query, schema: { type: string } }
        - { name: startPrivatePort, in: query, schema: { type: string } }
        - { name: endPrivatePort, in: query, schema: { type: string } }
        - { name: startPublicPort, in: query, schema: { type: string } }
        - { name: endPublicPort, in: query, schema: { type: string } }
        - { name: portForwardingId, in: query, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 규칙 목록 } }
    post:
      tags: [Compute - Networking]
      summary: 포트포워딩 규칙 생성
      parameters: [{ $ref: "#/components/parameters/Zone" }]
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicIpId, mappedIp, protocol, startPrivatePort, endPrivatePort, startPublicPort, endPublicPort]
              properties:
                publicIpId: { type: string }
                mappedIp: { type: string }
                protocol: { type: string }
                startPrivatePort: { type: string }
                endPrivatePort: { type: string }
                startPublicPort: { type: string }
                endPublicPort: { type: string }
      responses: { "200": { description: 생성됨 } }

  /{zone}/nsm/v1/portforwarding/{portforwardingId}:
    delete:
      tags: [Compute - Networking]
      summary: 포트포워딩 규칙 삭제
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: portforwardingId, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 삭제됨 } }

  /{zone}/nsm/v1/staticNat:
    get:
      tags: [Compute - Networking]
      summary: Static NAT 목록
      description: |
        응답 data 의 mappedIp (private) + publicIp (public) 매핑이 곧 server 의 fixed IP →
        Public IP 매핑.
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: page, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: Static NAT 목록 } }
    post:
      tags: [Compute - Networking]
      summary: Static NAT 생성
      parameters: [{ $ref: "#/components/parameters/Zone" }]
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicIpId, mappedIp]
              properties:
                publicIpId: { type: string }
                mappedIp: { type: string }
                sourceAddress: { type: string }
      responses: { "200": { description: 생성됨 } }

  /{zone}/nsm/v1/staticNat/{staticNatId}:
    delete:
      tags: [Compute - Networking]
      summary: Static NAT 삭제
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: staticNatId, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 삭제됨 } }

  /{zone}/nsm/v1/firewall/policy:
    get:
      tags: [Compute - Networking]
      summary: 방화벽 정책 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: page, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string } }
        - { name: policyId, in: query, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 정책 목록 } }
    post:
      tags: [Compute - Networking]
      summary: 방화벽 정책 생성
      parameters: [{ $ref: "#/components/parameters/Zone" }]
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [srcNat]
              properties:
                srcNat: { type: boolean }
                portForwardingId: { type: string }
                staticNatId: { type: string }
                srcInterface: { type: string }
                dstInterface: { type: string }
                action: { type: string }
                protocol: { type: string }
                startPort: { type: string }
                endPort: { type: string }
                srcNetwork: { type: array, items: { type: string } }
                dstNetwork: { type: array, items: { type: string } }
                srcAddress: { type: array, items: { type: string } }
                dstAddress: { type: array, items: { type: string } }
                comment: { type: string }
      responses: { "200": { description: 생성됨 } }

  /{zone}/nsm/v1/firewall/policy/{policyId}:
    delete:
      tags: [Compute - Networking]
      summary: 방화벽 정책 삭제
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: policyId, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 삭제됨 } }

  /{zone}/nsm/v1/vpc:
    get:
      tags: [Compute - Networking]
      summary: VPC 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: page, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: VPC 목록 } }

  /{zone}/nsm/v1/job/status/{jobid}:
    get:
      tags: [Compute - Networking]
      summary: 비동기 작업 상태 조회
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: jobid, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 작업 상태 } }

  # ============================================================
  # Compute - Tier (네트워크 Tier)
  # ============================================================
  /{zone}/nsm/v1/network:
    get:
      tags: [Compute - Tier]
      summary: Tier 네트워크 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: page, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string } }
        - { name: networkType, in: query, schema: { type: string } }
        - { name: isPrivateSubnet, in: query, schema: { type: boolean } }
        - { name: networkId, in: query, schema: { type: string } }
        - { name: refid, in: query, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: tier 네트워크 목록 } }
    post:
      tags: [Compute - Tier]
      summary: Tier 네트워크 생성
      parameters: [{ $ref: "#/components/parameters/Zone" }]
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string }
                isCustom: { type: boolean }
                detail:
                  type: object
                  properties:
                    cclass: { type: string }
                    cidr: { type: string }
                    gatewayIp: { type: string }
                    startIp: { type: string }
                    endIp: { type: string }
                    lbStartIp: { type: string }
                    lbEndIp: { type: string }
                    bmStartIp: { type: string }
                    bmEndIp: { type: string }
                    iscsiStartIp: { type: string }
                    iscsiEndIp: { type: string }
      responses: { "200": { description: 생성됨 } }

  /{zone}/nsm/v1/network/{networkId}:
    delete:
      tags: [Compute - Tier]
      summary: Tier 네트워크 삭제
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: networkId, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 삭제됨 } }

  # ============================================================
  # Compute - Volume (cinder)
  # ============================================================
  /{zone}/volume/{project_id}/volumes:
    post:
      tags: [Compute - Volume]
      summary: 볼륨 생성 (async)
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                availability_zone: { type: string }
                size: { type: integer }
                usage_plan_type: { type: string }
                name: { type: string }
                bootable: { type: boolean }
                snapshot_id: { type: string }
      responses: { "202": { description: 생성 요청 수락 } }

  /{zone}/volume/{project_id}/volumes/detail:
    get:
      tags: [Compute - Volume]
      summary: 볼륨 detail 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 볼륨 목록 } }

  /{zone}/volume/{project_id}/volumes/{volume_id}:
    parameters:
      - $ref: "#/components/parameters/Zone"
      - $ref: "#/components/parameters/ProjectId"
      - { name: volume_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Compute - Volume]
      summary: 볼륨 상세
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 볼륨 상세 } }
    delete:
      tags: [Compute - Volume]
      summary: 볼륨 삭제 (async)
      security: [{ KeystoneToken: [] }]
      responses: { "202": { description: 삭제 요청 수락 } }

  /{zone}/server/servers/{server_id}/os-volume_attachments:
    parameters:
      - $ref: "#/components/parameters/Zone"
      - { name: server_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Compute - Volume]
      summary: VM 에 attach 된 볼륨 목록
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: attach 된 볼륨 } }
    post:
      tags: [Compute - Volume]
      summary: 볼륨을 VM 에 attach (async)
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volumeId, device]
              properties:
                volumeId: { type: string }
                device: { type: string }
      responses: { "202": { description: 요청 수락 } }

  /{zone}/server/servers/{server_id}/os-volume_attachments/{volume_id}:
    parameters:
      - $ref: "#/components/parameters/Zone"
      - { name: server_id, in: path, required: true, schema: { type: string } }
      - { name: volume_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Compute - Volume]
      summary: attach 된 볼륨 상세
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 상세 } }
    delete:
      tags: [Compute - Volume]
      summary: 볼륨을 VM 에서 detach
      security: [{ KeystoneToken: [] }]
      responses: { "202": { description: 요청 수락 } }

  # ============================================================
  # Compute - Image (glance)
  # ============================================================
  /{zone}/volume/{project_id}/volumes/{volume_id}/action:
    post:
      tags: [Compute - Image]
      summary: 루트 볼륨에서 이미지 생성 (async)
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: volume_id, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [os-volume_upload_image]
              properties:
                os-volume_upload_image:
                  type: object
                  required: [image_name, container_format, disk_format]
                  properties:
                    force: { type: boolean }
                    image_name: { type: string }
                    container_format: { type: string }
                    disk_format: { type: string }
      responses: { "202": { description: 요청 수락 } }

  /{zone}/image/images:
    get:
      tags: [Compute - Image]
      summary: 이미지 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: limit, in: query, schema: { type: integer, default: 200 } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 이미지 목록 } }

  /{zone}/image/images/{image_id}:
    parameters:
      - $ref: "#/components/parameters/Zone"
      - { name: image_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Compute - Image]
      summary: 이미지 상세
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 이미지 상세 } }
    delete:
      tags: [Compute - Image]
