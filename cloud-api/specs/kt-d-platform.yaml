  # ============================================================
  # Management - Watch (모니터링)
  # ============================================================
  /{zone}/watch/v2/alarms:
    parameters: [{ $ref: "#/components/parameters/Zone" }]
    get:
      tags: [Management - Watch]
      summary: 알람 목록
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 알람 목록 } }
    post:
      tags: [Management - Watch]
      summary: 알람 생성
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alarmName, metricName, statisticType, period, evaluationPeriods, threshold, comparisonOperator, actionsEnabled]
              properties:
                alarmName: { type: string }
                serverId: { type: string, description: VM ID (serverId/imageNm/flavorVnm 중 하나 필수) }
                imageNm: { type: string }
                flavorVnm: { type: string }
                metricName: { type: string }
                statisticType: { type: string }
                period: { type: integer }
                evaluationPeriods: { type: integer }
                threshold: { type: integer }
                comparisonOperator: { type: string }
                actionsEnabled: { type: boolean }
                alarmStateActions: { type: string }
                insufficientStateActions: { type: string }
                okStateActions: { type: string }
                alarmTag: { type: string }
      responses: { "201": { description: 생성됨 } }
    delete:
      tags: [Management - Watch]
      summary: 알람 일괄 삭제
      parameters:
        - { name: alarmIds, in: query, required: true, schema: { type: string }, description: 콤마 분리 ID }
      security: [{ KeystoneToken: [] }]
      responses: { "204": { description: 삭제됨 } }

  /{zone}/watch/v2/alarms/{alarm_id}:
    parameters:
      - $ref: "#/components/parameters/Zone"
      - { name: alarm_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Management - Watch]
      summary: 알람 상세
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 알람 상세 } }
    put:
      tags: [Management - Watch]
      summary: 알람 수정
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alarmName: { type: string }
                serverId: { type: string }
                metricName: { type: string }
                statisticType: { type: string }
                period: { type: integer }
                evaluationPeriods: { type: integer }
                threshold: { type: integer }
                comparisonOperator: { type: string }
                actionsEnabled: { type: boolean }
                alarmTag: { type: string }
      responses: { "200": { description: 수정됨 } }
    delete:
      tags: [Management - Watch]
      summary: 알람 삭제
      security: [{ KeystoneToken: [] }]
      responses: { "204": { description: 삭제됨 } }

  /{zone}/watch/v2/alarms/{alarm_id}/history:
    get:
      tags: [Management - Watch]
      summary: 알람 이력
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: alarm_id, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 이력 } }

  /{zone}/watch/v2/alarms/{alarm_id}/action:
    put:
      tags: [Management - Watch]
      summary: 알람 상태/액션 변경
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: alarm_id, in: path, required: true, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemName, itemValue]
              properties:
                itemName: { type: string, description: actionsEnabled 또는 stateValue }
                itemValue: { type: string }
                stateReason: { type: string }
      responses: { "200": { description: 변경됨 } }

  /{zone}/watch/v3/metrics/metadata:
    get:
      tags: [Management - Watch]
      summary: 사용 가능한 metric 메타데이터
      parameters: [{ $ref: "#/components/parameters/Zone" }]
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: 메타데이터 } }

  /{zone}/watch/v3/metrics:
    get:
      tags: [Management - Watch]
      summary: Metric 데이터 조회
      parameters:
        - $ref: "#/components/parameters/Zone"
        - { name: namespace, in: query, required: true, schema: { type: string, default: "ucloud/server" } }
        - { name: metricName, in: query, required: true, schema: { type: string } }
        - { name: statisticType, in: query, required: true, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string } }
        - { name: term, in: query, required: true, schema: { type: string }, description: 조회 범위 (분, 1-1440) }
        - { name: dimension.name, in: query, schema: { type: string } }
        - { name: dimension.value, in: query, schema: { type: string } }
      security: [{ KeystoneToken: [] }]
      responses: { "200": { description: metric 시계열 } }

