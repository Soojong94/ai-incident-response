      tags: [Storage - ObjectStorage 2.0]
      summary: 컨테이너 메타데이터 / ACL / static web 수정
      parameters:
        - { name: X-Container-Read, in: header, schema: { type: string }, description: 읽기 ACL }
        - { name: X-Container-Write, in: header, schema: { type: string }, description: 쓰기 ACL }
      responses: { "204": { description: 수정됨 } }
    delete:
      tags: [Storage - ObjectStorage 2.0]
      summary: 빈 컨테이너 삭제
      responses: { "204": { description: 삭제됨 } }

  /v1/AUTH_{project_id}/{container}/{object}:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
      - { name: container, in: path, required: true, schema: { type: string } }
      - { name: object, in: path, required: true, schema: { type: string } }
      - { name: X-Auth-Token, in: header, required: true, schema: { type: string } }
    head:
      tags: [Storage - ObjectStorage 2.0]
      summary: 객체 메타데이터
      responses: { "200": { description: 메타데이터 헤더 } }
    get:
      tags: [Storage - ObjectStorage 2.0]
      summary: 객체 다운로드 (TempURL 지원)
      parameters:
        - { name: temp_url_sig, in: query, schema: { type: string } }
        - { name: temp_url_expires, in: query, schema: { type: string } }
      responses: { "200": { description: 객체 콘텐츠 } }
    put:
      tags: [Storage - ObjectStorage 2.0]
      summary: 객체 업로드 / 복사 / SLO / Symlink / 아카이브 추출
      parameters:
        - { name: Content-Type, in: header, schema: { type: string } }
        - { name: Content-Length, in: header, schema: { type: string } }
        - { name: Transfer-Encoding, in: header, schema: { type: string, enum: [chunked] } }
        - { name: X-Delete-At, in: header, schema: { type: string } }
        - { name: X-Delete-After, in: header, schema: { type: string } }
        - { name: X-Copy-From, in: header, schema: { type: string } }
        - { name: X-Object-Manifest, in: header, schema: { type: string }, description: DLO 매니페스트 }
        - { name: multipart-manifest, in: query, schema: { type: string }, description: put → SLO }
        - { name: symlink, in: query, schema: { type: string } }
        - { name: extract-archive, in: query, schema: { type: string, enum: [tar, "tar.gz", "tar.bz2"] } }
      responses: { "201": { description: 업로드됨 } }
    post:
      tags: [Storage - ObjectStorage 2.0]
      summary: 객체 메타데이터 수정
      responses: { "202": { description: 수정됨 } }
    delete:
      tags: [Storage - ObjectStorage 2.0]
      summary: 객체 삭제 (?bulk-delete 로 대량 삭제)
      parameters:
        - { name: bulk-delete, in: query, schema: { type: string } }
      responses: { "204": { description: 삭제됨 } }

