  /v1/AUTH_{project_id}:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string } }
      - { name: X-Auth-Token, in: header, required: true, schema: { type: string } }
    get:
      tags: [Storage - ObjectStorage 2.0]
      summary: 컨테이너 목록
      parameters:
        - { name: limit, in: query, schema: { type: string } }
        - { name: marker, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json, xml] } }
      responses: { "200": { description: 컨테이너 목록 } }
    head:
      tags: [Storage - ObjectStorage 2.0]
      summary: 계정 메타데이터
      responses: { "204": { description: 메타데이터 헤더 } }
    post:
      tags: [Storage - ObjectStorage 2.0]
      summary: 계정 메타데이터 수정
      parameters:
        - { name: X-Account-Meta-Temp-URL-Key, in: header, schema: { type: string } }
      responses: { "204": { description: 수정됨 } }

