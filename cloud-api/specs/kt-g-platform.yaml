        - { name: X-Storage-Policy, in: header, schema: { type: string } }
      responses: { "201": { description: 생성됨 } }
    get:
      tags: [Storage - ObjectStorage 2.0]
      summary: 컨테이너 객체 목록
      parameters:
        - { name: limit, in: query, schema: { type: string } }
        - { name: marker, in: query, schema: { type: string } }
        - { name: prefix, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses: { "200": { description: 목록 } }
    head:
      tags: [Storage - ObjectStorage 2.0]
      summary: 컨테이너 메타데이터
      responses: { "204": { description: 메타데이터 } }
    post:
      tags: [Storage - ObjectStorage 2.0]
      summary: 컨테이너 메타 / Static Web / ACL 설정
      parameters:
        - { name: X-Container-Read, in: header, schema: { type: string } }
        - { name: X-Container-Meta-Web-Index, in: header, schema: { type: string } }
        - { name: X-Container-Meta-Web-Error, in: header, schema: { type: string } }
        - { name: X-Container-Meta-Web-Listings, in: header, schema: { type: string } }
      responses: { "204": { description: 수정됨 } }
    delete:
      tags: [Storage - ObjectStorage 2.0]
      summary: 컨테이너 삭제
      responses: { "204": { description: 삭제됨 } }

  /v2/{account}/{container}/{object}:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string } }
      - { name: container, in: path, required: true, schema: { type: string } }
      - { name: object, in: path, required: true, schema: { type: string } }
      - { name: X-Auth-Token, in: header, required: true, schema: { type: string } }
    head:
      tags: [Storage - ObjectStorage 2.0]
