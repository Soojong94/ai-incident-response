openapi: 3.0.3
info:
  title: KT Cloud G-platform — Open API 전체
  version: "1.0"
  description: |
    KT Cloud G-platform (공공 클라우드) Open API 전체.
    출처: https://cloud.kt.com/docs/open-api-guide/g/guide/how-to-use

    Zone: gd1 (DX-G) / gd4 (DX-G-YS)

    KT G-platform 의 Compute/Network/CDN/WAF/AutoScaling/Watch/Messaging/RDB 는 모두
    CloudStack 스타일의 단일 dispatch endpoint + `command` query 파라미터 패턴입니다.
    OpenAPI 의 path 1개로 표현 불가능 → 각 command 별 synthetic path 로 분리 표기.

    공통 인증 query (모든 호출에 필수):
      - apiKey   : API 인증 키
      - signature: HMAC-SHA1 서명
      - response : json | xml

servers:
  - url: https://api.ucloudbiz.olleh.com
    description: G-platform 공용 base
  - url: https://ss1.cloud.kt.com:1000
    description: Object Storage 전용 host (해당 시)

x-tagGroups:
  - name: 공통
    tags:
      - 인증
  - name: Computing
    tags:
      - Compute - Virtual Machine
      - Compute - Networking
      - Compute - Private Subnet
      - Compute - Disk Volume
      - Compute - Image
      - Compute - Snapshot
      - Compute - SSH Keypair
  - name: Network
    tags:
      - Network - LoadBalancer
      - Network - GSLB
      - Network - CloudLINK
  - name: Storage
    tags:
      - Storage - NAS
      - Storage - ObjectStorage 2.0
      - Storage - ObjectStorage 1.0
  - name: CDN
    tags:
      - CDN
  - name: Security
    tags:
      - Security - WAF
  - name: DB
    tags:
      - DB - RDBaaS MySQL
  - name: Management
    tags:
      - Management - AutoScaling
      - Management - Watch
      - Management - Messaging

tags:
  - { name: 인증 }
  - { name: Compute - Virtual Machine }
  - { name: Compute - Networking }
  - { name: Compute - Private Subnet }
  - { name: Compute - Disk Volume }
  - { name: Compute - Image }
  - { name: Compute - Snapshot }
  - { name: Compute - SSH Keypair }
  - { name: Network - LoadBalancer }
  - { name: Network - GSLB }
  - { name: Network - CloudLINK }
  - { name: Storage - NAS }
  - { name: Storage - ObjectStorage 2.0 }
  - { name: Storage - ObjectStorage 1.0 }
  - { name: CDN }
  - { name: Security - WAF }
  - { name: DB - RDBaaS MySQL }
  - { name: Management - AutoScaling }
  - { name: Management - Watch }
  - { name: Management - Messaging }

paths:
  # ============================================================
  # 인증 — Open API 호출 시 공통 query (apiKey, signature, response)
  # ============================================================
  /docs/auth:
    get:
      tags: [인증]
      summary: 공통 인증 파라미터 (참고)
      description: |
        KT G-platform 의 모든 Open API 는 다음 query 를 공통으로 요구합니다:
          - apiKey    : KT 콘솔에서 발급된 API Key
          - signature : HMAC-SHA1(secretKey, lower(canonicalQuery)) base64
          - response  : json | xml

        signature 계산:
        1. query string 의 모든 키를 소문자로 변환
        2. 알파벳 오름차순으로 정렬
        3. 'key=value' 를 '&' 로 join
        4. HMAC-SHA1(secretKey, sorted-lower-canonical) → base64 → URL encode
      responses: { "200": { description: 인증 설명 (실제 호출 가능 endpoint 아님) } }

  # ============================================================
  # Compute - Virtual Machine
  # base: /{zone}/server/{projectId}/server ?command=<cmd>
  # ============================================================
  /{zone}/server/{projectId}/server/deployVirtualMachine:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 배포 (생성)
      description: "실제 호출: GET /{zone}/server/{projectId}/server?command=deployVirtualMachine"
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: zoneid, in: query, required: true, schema: { type: string } }
        - { name: serviceofferingid, in: query, required: true, schema: { type: string } }
        - { name: templateid, in: query, required: true, schema: { type: string }, description: OS 템플릿 ID }
        - { name: diskofferingid, in: query, schema: { type: string } }
        - { name: productcode, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: displayname, in: query, schema: { type: string } }
        - { name: usageplantype, in: query, schema: { type: string, enum: [hourly, monthly] } }
        - { name: keypair, in: query, schema: { type: string } }
        - { name: networkids, in: query, schema: { type: string } }
        - { name: userdata, in: query, schema: { type: string } }
      responses: { "200": { description: 배포 요청 수락 } }

  /{zone}/server/{projectId}/server/listVirtualMachines:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 목록 조회
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, schema: { type: string } }
        - { name: zoneid, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: networkid, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pagesize, in: query, schema: { type: integer } }
        - { name: listall, in: query, schema: { type: boolean } }
      responses: { "200": { description: VM 목록 } }

  /{zone}/server/{projectId}/server/destroyVirtualMachine:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 파기 (정지 상태)
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 파기됨 } }

  /{zone}/server/{projectId}/server/startVirtualMachine:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 시작
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 시작됨 } }

  /{zone}/server/{projectId}/server/stopVirtualMachine:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 정지
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 정지됨 } }

  /{zone}/server/{projectId}/server/rebootVirtualMachine:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 재부팅
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 재부팅됨 } }

  /{zone}/server/{projectId}/server/restoreVirtualMachine:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 루트디스크 재초기화
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: virtualmachineid, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 재초기화됨 } }

  /{zone}/server/{projectId}/server/changeServiceForVirtualMachineVerify:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM CPU/Memory 변경 가능 여부 확인
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: serviceofferingid, in: query, required: true, schema: { type: string } }
        - { name: serviceofferingcode, in: query, schema: { type: string }, description: "예: 2x4" }
      responses: { "200": { description: 가능 여부 } }

  /{zone}/server/{projectId}/server/changeServiceForVirtualMachine:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM CPU/Memory 변경 (VM 정지 상태에서)
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: serviceofferingid, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 변경됨 } }

  /{zone}/server/{projectId}/server/updateVirtualMachine:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 이름 / HA 옵션 변경
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: displayname, in: query, schema: { type: string } }
        - { name: haenable, in: query, schema: { type: boolean } }
      responses: { "200": { description: 변경됨 } }

  /{zone}/server/{projectId}/server/listVirtualMachineForCharge:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 과금 정보 조회
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 과금 정보 } }

  /{zone}/server/{projectId}/server/updateVirtualMachineForCharge:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 과금 모델 변경 (hourly / monthly)
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: usageplantype, in: query, required: true, schema: { type: string, enum: [hourly, monthly] } }
      responses: { "200": { description: 변경됨 } }

  /{zone}/server/{projectId}/server/checkVirtualMachineName:
    get:
      tags: [Compute - Virtual Machine]
      summary: VM 이름 중복 확인
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: display_name, in: query, schema: { type: string } }
      responses: { "200": { description: 사용 가능 여부 } }

  # ============================================================
  # Compute - Networking (Public IP / Port Forwarding / Static NAT / Firewall)
  # ============================================================
  /{zone}/server/{projectId}/network/associateIpAddress:
    get:
      tags: [Compute - Networking]
      summary: Public IP 할당
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: zoneid, in: query, required: true, schema: { type: string } }
        - { name: usageplantype, in: query, schema: { type: string, enum: [hourly, monthly] } }
        - { name: networkid, in: query, schema: { type: string } }
      responses: { "200": { description: 할당됨 } }

  /{zone}/server/{projectId}/network/listPublicIpAddresses:
    get:
      tags: [Compute - Networking]
      summary: Public IP 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, schema: { type: string } }
        - { name: ipaddress, in: query, schema: { type: string } }
        - { name: zoneid, in: query, schema: { type: string } }
        - { name: allocatedonly, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pagesize, in: query, schema: { type: integer } }
      responses: { "200": { description: IP 목록 } }

  /{zone}/server/{projectId}/network/updateIpAddress:
    get:
      tags: [Compute - Networking]
      summary: Public IP 설명 변경
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: desc, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 변경됨 } }

  /{zone}/server/{projectId}/network/disassociateIpAddress:
    get:
      tags: [Compute - Networking]
      summary: Public IP 해제
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 해제됨 } }

  /{zone}/server/{projectId}/network/createPortForwardingRule:
    get:
      tags: [Compute - Networking]
      summary: Port Forwarding 규칙 생성
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: ipaddressid, in: query, required: true, schema: { type: string } }
        - { name: privateport, in: query, required: true, schema: { type: integer } }
        - { name: publicport, in: query, required: true, schema: { type: integer } }
        - { name: protocol, in: query, required: true, schema: { type: string, enum: [TCP, UDP] } }
        - { name: virtualmachineid, in: query, required: true, schema: { type: string } }
        - { name: openfirewall, in: query, schema: { type: boolean } }
        - { name: cidrlist, in: query, schema: { type: string } }
      responses: { "200": { description: 생성됨 } }

  /{zone}/server/{projectId}/network/listPortForwardingRules:
    get:
      tags: [Compute - Networking]
      summary: Port Forwarding 규칙 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, schema: { type: string } }
        - { name: ipaddressid, in: query, schema: { type: string } }
      responses: { "200": { description: 규칙 목록 } }

  /{zone}/server/{projectId}/network/deletePortForwardingRule:
    get:
      tags: [Compute - Networking]
      summary: Port Forwarding 규칙 삭제
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 삭제됨 } }

  /{zone}/server/{projectId}/network/enableStaticNat:
    get:
      tags: [Compute - Networking]
      summary: Static NAT 활성화
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: ipaddressid, in: query, required: true, schema: { type: string } }
        - { name: virtualmachineid, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 활성화 } }

  /{zone}/server/{projectId}/network/disableStaticNat:
    get:
      tags: [Compute - Networking]
      summary: Static NAT 비활성화
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: ipaddressid, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 비활성화 } }

  /{zone}/server/{projectId}/network/createFirewallRule:
    get:
      tags: [Compute - Networking]
      summary: 방화벽 규칙 생성
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: ipaddressid, in: query, required: true, schema: { type: string } }
        - { name: protocol, in: query, required: true, schema: { type: string, enum: [TCP, UDP, ICMP] } }
        - { name: startport, in: query, required: true, schema: { type: integer } }
        - { name: endport, in: query, schema: { type: integer } }
        - { name: cidrlist, in: query, schema: { type: string } }
      responses: { "200": { description: 생성됨 } }

  /{zone}/server/{projectId}/network/listFirewallRules:
    get:
      tags: [Compute - Networking]
      summary: 방화벽 규칙 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, schema: { type: string } }
        - { name: ipaddressid, in: query, schema: { type: string } }
      responses: { "200": { description: 규칙 목록 } }

  /{zone}/server/{projectId}/network/deleteFirewallRule:
    get:
      tags: [Compute - Networking]
      summary: 방화벽 규칙 삭제
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 삭제됨 } }

  /{zone}/server/{projectId}/network/listNetworkUsages:
    get:
      tags: [Compute - Networking]
      summary: 네트워크 트래픽 사용량
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: startdate, in: query, required: true, schema: { type: string }, description: YYYY-MM-DD }
        - { name: enddate, in: query, required: true, schema: { type: string }, description: 최대 1개월 }
        - { name: zoneid, in: query, schema: { type: string } }
      responses: { "200": { description: 트래픽 } }

  /{zone}/server/{projectId}/network/getNetworkAlarmHistory:
    get:
      tags: [Compute - Networking]
      summary: 네트워크 사용량 알람 이력
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: startdate, in: query, required: true, schema: { type: string } }
        - { name: enddate, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 알람 이력 } }

  /{zone}/server/{projectId}/network/listNetworkFlatRate:
    get:
      tags: [Compute - Networking]
      summary: 정액제 가입 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
      responses: { "200": { description: 정액제 목록 } }

  # ============================================================
  # Compute - Private Subnet
  # ============================================================
  /{zone}/server/{projectId}/subnet/createNetwork:
    get:
      tags: [Compute - Private Subnet]
      summary: Private Subnet 생성
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: zoneid, in: query, required: true, schema: { type: string } }
        - { name: account, in: query, required: true, schema: { type: string } }
        - { name: domainid, in: query, required: true, schema: { type: string } }
        - { name: ipcount, in: query, required: true, schema: { type: integer, enum: [32, 64, 128] } }
        - { name: displaytext, in: query, schema: { type: string } }
      responses: { "200": { description: 생성됨 } }

  /{zone}/server/{projectId}/subnet/listNetworks:
    get:
      tags: [Compute - Private Subnet]
      summary: Private Subnet 목록
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, schema: { type: string } }
        - { name: zoneid, in: query, schema: { type: string } }
        - { name: listall, in: query, schema: { type: boolean } }
      responses: { "200": { description: subnet 목록 } }

  /{zone}/server/{projectId}/subnet/deleteNetwork:
    get:
      tags: [Compute - Private Subnet]
      summary: Private Subnet 삭제
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 삭제됨 } }

  /{zone}/server/{projectId}/subnet/addNicToVirtualMachine:
    get:
      tags: [Compute - Private Subnet]
      summary: VM 을 Private Subnet 에 연결
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: networkid, in: query, required: true, schema: { type: string } }
        - { name: virtualmachineid, in: query, required: true, schema: { type: string } }
        - { name: ipaddress, in: query, schema: { type: string } }
      responses: { "200": { description: 연결됨 } }

  /{zone}/server/{projectId}/subnet/removeNicFromVirtualMachine:
    get:
      tags: [Compute - Private Subnet]
      summary: VM 을 Private Subnet 에서 해제
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: nicid, in: query, required: true, schema: { type: string } }
        - { name: virtualmachineid, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 해제됨 } }

  /{zone}/server/{projectId}/subnet/requestForInterAz:
    get:
      tags: [Compute - Private Subnet]
      summary: Inter-AZ subnet peering 요청
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: sourcenetworkid, in: query, required: true, schema: { type: string } }
        - { name: destnetworkid, in: query, required: true, schema: { type: string } }
        - { name: sourcezoneid, in: query, schema: { type: string } }
        - { name: destzoneid, in: query, schema: { type: string } }
      responses: { "200": { description: 요청됨 } }

  /{zone}/server/{projectId}/subnet/interAzStatus:
    get:
      tags: [Compute - Private Subnet]
      summary: Inter-AZ peering 상태
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: sourcenetworkid, in: query, required: true, schema: { type: string } }
        - { name: destnetworkid, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: 상태 } }

  # ============================================================
  # Compute - Disk Volume
  # ============================================================
  /{zone}/server/{projectId}/volume/createVolume:
    get:
      tags: [Compute - Disk Volume]
      summary: 볼륨 생성
      parameters:
        - $ref: "#/components/parameters/Zone"
        - $ref: "#/components/parameters/ProjectId"
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: diskofferingid, in: query, required: true, schema: { type: string } }
        - { name: zoneid, in: query, required: true, schema: { type: string } }
        - { name: usageplantype, in: query, schema: { type: string, enum: [hourly, monthly] } }
        - { name: size, in: query, schema: { type: integer } }
        - { name: snapshotid, in: query, schema: { type: string } }
