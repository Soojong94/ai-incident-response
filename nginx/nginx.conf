server {
    listen 80;
    server_name tbit-msp.kro.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tbit-msp.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/tbit-msp.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tbit-msp.kro.kr/privkey.pem;

    client_max_body_size 32m;

    # ── 에이전트 인제스트 (TLS 종단) ─────────────────────────────────────────────
    # VictoriaMetrics/VictoriaLogs는 무인증이라 평문 8428/9428을 공개하면 안 됨.
    # 대신 여기로(443, TLS) 받아 basic-auth 검증 후 내부 컨테이너로 전달.
    # 에이전트는 https://tbit-msp.kro.kr/vm/api/v1/write , /vl/insert/loki/api/v1/push 로 전송.
    location /vm/ {
        auth_basic           "ingest";
        auth_basic_user_file /etc/nginx/ingest.htpasswd;
        proxy_pass           http://victoriametrics:8428/;
        proxy_read_timeout   60s;
    }
    location /vl/ {
        auth_basic           "ingest";
        auth_basic_user_file /etc/nginx/ingest.htpasswd;
        proxy_pass           http://victorialogs:9428/;
        proxy_read_timeout   60s;
    }

    # ── webhook은 공개 금지 ──────────────────────────────────────────────────────
    # Alertmanager는 내부(compose 네트워크)에서 app:8000/webhook/alert 를 직접 호출.
    # 외부에서 가짜 알람 주입 못 하도록 공개 경로는 차단. (분리 배포 시엔 사설 hop + WEBHOOK_SECRET)
    location /webhook/ { return 403; }

    location / {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
